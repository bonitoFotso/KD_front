version: '3.8'
services:
  # Service pour l'application React en développement //test8
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_APP_API_URL=http://localhost:8000/api
    stdin_open: true
    command: npm run dev
  
  # Service Nginx pour servir l'application en production
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./dist:/usr/share/nginx/html
    depends_on:
      - frontend-dev
    restart: always
    # Décommenter si vous voulez activer ce service uniquement pour la production
    # profiles:
    #   - prod