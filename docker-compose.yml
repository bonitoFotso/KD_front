version: '3.8'

services:
  # Service pour l'application React en développement //test
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_APP_API_URL=http://localhost:8000/api
    stdin_open: true
    command: npm run dev

